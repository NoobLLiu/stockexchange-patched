name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  residence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Zrips/Residence
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Residence
        run: mvn -B -q package -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: residence
          path: target/Residence6.0.2.2.jar

  release:
    runs-on: ubuntu-latest
    needs: residence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: residence
          path: build/deps
      - name: Build plugin
        run: bash ci/build.sh
        env:
          RESIDENCE_JAR: build/deps/Residence6.0.2.2.jar
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ci/RELEASE_NOTES.md
          files: build/StockExchange-1.0.0-gmzc.jar
